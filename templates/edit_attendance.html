<!DOCTYPE html>
<html>
<head>
<title>Edit Attendance</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/daily_closing.css') }}">
</head>

<body>

<div class="main-content" style="margin:40px auto;max-width:700px;">

<div class="box">
<div class="box-title">Edit Attendance</div>

<form method="POST" action="/update-attendance/{{ att['id'] }}">

<div class="form-grid">

<div class="input-group">
<label>Date</label>
<input type="date" name="date" value="{{ att['date'] }}" required>
</div>

<div class="input-group">
<label>Staff Name</label>
<select name="staff_name" required>
{% for staff in staff_list %}
<option value="{{ staff['staff_name'] }}"
{% if staff['staff_name'] == att['staff_name'] %}selected{% endif %}>
{{ staff['staff_name'] }}
</option>
{% endfor %}
</select>
</div>

<div class="input-group">
<label>Status</label>
<select name="attendance_status" required>
<option {% if att['attendance_status']=='Present' %}selected{% endif %}>Present</option>
<option {% if att['attendance_status']=='Absent' %}selected{% endif %}>Absent</option>
<option {% if att['attendance_status']=='Leave' %}selected{% endif %}>Leave</option>
</select>
</div>

</div>

<br>

<button class="save-btn-top" type="submit">Update Attendance</button>
<a href="/attendance" class="add-btn">Cancel</a>

</form>
</div>

</div>

</body>
</html>

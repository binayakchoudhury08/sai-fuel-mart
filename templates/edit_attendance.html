<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Attendance</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#eef3f8;
    font-family:'Segoe UI',sans-serif;
}

.wrapper{
    max-width:850px;
    margin:40px auto;
}

.box{
    background:white;
    border-radius:28px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.title{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:26px;
}

.title h2{
    font-size:30px;
    margin:0;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    font-size:13px;
    font-weight:800;
    color:#475569;
    margin-bottom:8px;
}

.input-group input,
.input-group select{
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:16px;
    outline:none;
    font-size:14px;
}

.action-row{
    display:flex;
    gap:14px;
    margin-top:28px;
}

.save-btn{
    flex:1;
    border:none;
    background:#2563eb;
    color:white;
    padding:15px;
    border-radius:16px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.cancel-btn{
    flex:1;
    background:#f1f5f9;
    color:#0f172a;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    font-weight:900;
}

.status-preview{
    margin-top:26px;
    background:#f8fafc;
    border-radius:20px;
    padding:20px;
}

.status-preview h3{
    margin-bottom:16px;
}

.badges{
    display:flex;
    gap:12px;
}

.badge{
    padding:10px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:900;
}

.present{
    background:#dcfce7;
    color:#15803d;
}

.absent{
    background:#fee2e2;
    color:#dc2626;
}

.leave{
    background:#fef3c7;
    color:#d97706;
}

@media(max-width:800px){

.form-grid{
    grid-template-columns:1fr;
}

.action-row{
    flex-direction:column;
}

}

</style>
</head>

<body>

<div class="wrapper">

<div class="box">

<div class="title">
<i class="fa-solid fa-user-pen"></i>
<h2>Edit Attendance</h2>
</div>

<form method="POST"
action="/update-attendance/{{ att['id'] }}">

<div class="form-grid">

<div class="input-group">
<label>Date</label>

<input type="date"
name="date"
value="{{ att['date'] }}"
required>

</div>

<div class="input-group">
<label>Employee</label>

<select name="staff_name" required>

{% for staff in staff_list %}

<option
value="{{ staff['staff_name'] }}"

{% if staff['staff_name'] == att['staff_name'] %}
selected
{% endif %}

>

{{ staff['staff_name'] }}

</option>

{% endfor %}

</select>

</div>

<div class="input-group">
<label>Attendance Status</label>

<select name="attendance_status" required>

<option
value="Present"

{% if att['attendance_status'] == 'Present' %}
selected
{% endif %}

>

Present

</option>

<option
value="Absent"

{% if att['attendance_status'] == 'Absent' %}
selected
{% endif %}

>

Absent

</option>

<option
value="Leave"

{% if att['attendance_status'] == 'Leave' %}
selected
{% endif %}

>

Leave

</option>

</select>

</div>

</div>

<div class="status-preview">

<h3>Attendance Meaning</h3>

<div class="badges">

<div class="badge present">
P = Present
</div>

<div class="badge absent">
A = Absent
</div>

<div class="badge leave">
L = Leave
</div>

</div>

</div>

<div class="action-row">

<button class="save-btn" type="submit">
<i class="fa-solid fa-floppy-disk"></i>
Update Attendance
</button>

<a href="/attendance"
class="cancel-btn">

Cancel

</a>

</div>

</form>

</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Proof Upload - Sai Fuel Mart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f3f4f6;margin:0;padding:15px;}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:15px;box-shadow:0 4px 14px rgba(0,0,0,.08);}
h2,h3{margin-top:0;color:#07120C;}
label{font-weight:700;margin-top:12px;display:block;}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #d1d5db;border-radius:10px;}
button{width:100%;padding:15px;background:#16a34a;color:white;border:0;border-radius:12px;font-size:17px;font-weight:700;}
.hidden{display:none;}
.gps-box{background:#ecfdf3;color:#166534;padding:10px;border-radius:10px;margin-top:10px;font-weight:bold;}
</style>
</head>

<body>

<form method="POST" action="/save-proof-upload" enctype="multipart/form-data">

<input type="hidden" name="latitude" id="latitude">
<input type="hidden" name="longitude" id="longitude">
<input type="hidden" name="client_time" id="client_time">

<div class="card">
<h2>Proof Upload</h2>

<label>Date</label>
<input type="date" name="proof_date" value="{{ today }}" required>

<label>Proof Type</label>
<select name="proof_type" id="proof_type" required onchange="showSection()">
<option value="">Select Proof Type</option>
<option value="Nozzle Testing">Nozzle Testing</option>
<option value="Dip Check">Dip Check</option>
</select>

<div class="gps-box" id="gpsStatus">Getting GPS location...</div>
</div>

<div id="nozzle_section" class="hidden">

<div class="card">
<h3>MS Nozzle Testing</h3>

<label>MS Stock Status</label>
<select name="ms_stock_status">
<option value="Available">Available</option>
<option value="No Stock">No Stock</option>
</select>

<label>MS1 Photo</label>
<input type="file" name="MS1_photo" accept="image/*" capture="environment">

<label>MS2 Photo</label>
<input type="file" name="MS2_photo" accept="image/*" capture="environment">

<label>MS3 Photo</label>
<input type="file" name="MS3_photo" accept="image/*" capture="environment">
</div>

<div class="card">
<h3>HSD Nozzle Testing</h3>

<label>HSD Stock Status</label>
<select name="hsd_stock_status">
<option value="Available">Available</option>
<option value="No Stock">No Stock</option>
</select>

<label>HSD1 Photo</label>
<input type="file" name="HSD1_photo" accept="image/*" capture="environment">

<label>HSD2 Photo</label>
<input type="file" name="HSD2_photo" accept="image/*" capture="environment">

<label>HSD3 Photo</label>
<input type="file" name="HSD3_photo" accept="image/*" capture="environment">
</div>

</div>

<div id="dip_section" class="hidden">

<div class="card">
<h3>MS Dip Check</h3>

<label>MS Stock Status</label>
<select name="ms_dip_status">
<option value="Available">Available</option>
<option value="No Stock">No Stock</option>
</select>

<label>MS Morning Dip Photo</label>
<input type="file" name="MS_Morning_Dip_photo" accept="image/*" capture="environment">

<label>MS Evening Dip Photo</label>
<input type="file" name="MS_Evening_Dip_photo" accept="image/*" capture="environment">
</div>

<div class="card">
<h3>HSD Dip Check</h3>

<label>HSD Stock Status</label>
<select name="hsd_dip_status">
<option value="Available">Available</option>
<option value="No Stock">No Stock</option>
</select>

<label>HSD Morning Dip Photo</label>
<input type="file" name="HSD_Morning_Dip_photo" accept="image/*" capture="environment">

<label>HSD Evening Dip Photo</label>
<input type="file" name="HSD_Evening_Dip_photo" accept="image/*" capture="environment">
</div>

</div>

<button type="submit">Upload Proof</button>

</form>

<script>
function showSection(){
    let type = document.getElementById("proof_type").value;
    document.getElementById("nozzle_section").style.display = "none";
    document.getElementById("dip_section").style.display = "none";

    if(type === "Nozzle Testing"){
        document.getElementById("nozzle_section").style.display = "block";
    }

    if(type === "Dip Check"){
        document.getElementById("dip_section").style.display = "block";
    }
}

document.getElementById("client_time").value = new Date().toLocaleString();

if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
        function(position){
            document.getElementById("latitude").value = position.coords.latitude;
            document.getElementById("longitude").value = position.coords.longitude;
            document.getElementById("gpsStatus").innerText =
            "GPS Captured: " + position.coords.latitude.toFixed(5) + ", " + position.coords.longitude.toFixed(5);
        },
        function(){
            document.getElementById("gpsStatus").innerText =
            "GPS not allowed. Please allow location permission.";
        }
    );
}else{
    document.getElementById("gpsStatus").innerText = "GPS not supported.";
}
</script>

</body>
</html>

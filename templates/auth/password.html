{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="pagehead"><div class="grow"><h1>Change password</h1>
{% if user.must_change_pw %}<p>Choose your own password before you continue.</p>{% endif %}</div></div>
<form class="section" method="post" style="max-width:460px"><div class="body stack">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div><label>Current password</label><input type="password" name="old_password" required autocomplete="current-password"></div>
  <div><label>New password (8+ characters)</label><input type="password" name="new_password" minlength="8" required autocomplete="new-password"></div>
  <div><label>New password again</label><input type="password" name="new_password2" minlength="8" required autocomplete="new-password"></div>
  <button class="btn">Change password</button></div></form>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Info - Settings - Sai Fuel Mart</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#f1f5f9;margin:0;padding:30px;color:#0f172a;}
.container{max-width:760px;margin:auto;}
.back-btn{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;text-decoration:none;background:#07120C;color:white;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;}
.card{background:white;border-radius:26px;padding:32px;box-shadow:0 10px 35px rgba(0,0,0,.06);}
.head{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
.head-icon{width:52px;height:52px;border-radius:16px;background:#eef2ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-size:22px;}
h1{font-size:22px;margin:0;}
p.sub{color:#64748b;margin:22px 0 26px;font-size:13.5px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.input-group{display:flex;flex-direction:column;}
.input-group.full{grid-column:1 / -1;}
label{font-size:13px;font-weight:700;color:#334155;margin-bottom:8px;}
input{padding:13px 14px;border:1px solid #d1d5db;border-radius:12px;font-size:14px;}
input:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12);}
.save-btn{width:100%;margin-top:26px;padding:16px;background:#16a34a;color:white;border:none;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
</style>
</head>

<body>
<div class="container">

<a href="/settings" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Settings</a>

<div class="card">

<div class="head">
<div class="head-icon"><i class="fa-solid fa-building"></i></div>
<h1>Business Info</h1>
</div>

<p class="sub">Shown on the letterhead of every transporter bill PDF you export.</p>

<form method="POST" action="/save-business-info">

<div class="form-grid">

<div class="input-group">
<label>Station Name</label>
<input type="text" name="station_name" placeholder="Sai Fuel Mart"
value="{{ settings['station_name'] if settings and settings['station_name'] else '' }}">
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="text" name="phone_number" placeholder="98765 43210"
value="{{ settings['phone_number'] if settings and settings['phone_number'] else '' }}">
</div>

<div class="input-group full">
<label>Address</label>
<input type="text" name="station_address" placeholder="NH-16, Village Road, District, State - PIN"
value="{{ settings['station_address'] if settings and settings['station_address'] else '' }}">
</div>

<div class="input-group">
<label>GSTIN</label>
<input type="text" name="gstin" placeholder="22AAAAA0000A1Z5"
value="{{ settings['gstin'] if settings and settings['gstin'] else '' }}">
</div>

</div>

<button class="save-btn" type="submit">
<i class="fa-solid fa-floppy-disk"></i> Save Business Info
</button>

</form>

</div>
</div>
</body>
</html>

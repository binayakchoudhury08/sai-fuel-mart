<!DOCTYPE html>
<html>
<head>
    <title>Settings - Sai Fuel Mart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/daily_closing.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">
        <div class="logo">
            <h2>SAI FUEL MART</h2>
            <p>FUELING YOUR TRUST</p>
        </div>

        <nav>
            <a href="/dashboard"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/daily-closing"><i class="fa-solid fa-file-invoice-dollar"></i> Daily Closing</a>
            <a href="/nozzle-management">
<i class="fa-solid fa-gas-pump"></i>
Nozzle Management
</a>
            <a href="/tank-level"><i class="fa-solid fa-oil-well"></i> Tank Level</a>
            <a href="/credit-transport"><i class="fa-solid fa-truck"></i> Credit Transport</a>
            <a href="/digital-collection"><i class="fa-solid fa-credit-card"></i> Digital Collection</a>
            <a href="/lube-stock"><i class="fa-solid fa-bottle-droplet"></i> Lube Stock</a>
            <a href="/attendance"><i class="fa-solid fa-user-check"></i> Attendance</a>
            <a href="/reports"><i class="fa-solid fa-chart-line"></i> Reports</a>
            <a class="active" href="/settings"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
    </aside>

    <main class="main-content">

        <div class="topbar">
            <div>
                <h1>Settings</h1>
                <p>Manage fuel rates and basic setup</p>
            </div>
        </div>

        <form method="POST" action="/save-settings" class="box">

            <div class="box-title">
                <i class="fa-solid fa-gas-pump"></i> Fuel Rate Settings
            </div>

            <a href="/download-db" class="btn btn-success">
    Download Database Backup
</a>

            <div class="form-grid">

                <div class="input-group">
                    <label>MS Rate</label>
                    <input type="number" step="0.01" name="ms_rate" value="{{ settings['ms_rate'] if settings else '' }}">

                </div>

                <div class="input-group">
                    <label>HSD Rate</label>
                    <input type="number" step="0.01" name="hsd_rate" value="{{ settings['hsd_rate'] if settings else '' }}">

                </div>

                <div class="input-group">

<label>CNG Rate</label>

<input type="number" step="0.01" name="cng_rate" value="{{ settings['cng_rate'] if settings else '' }}">

</div>

            </div>

            <br>

            <button class="save-btn-top" type="submit">
                <i class="fa-solid fa-floppy-disk"></i> Save Settings
            </button>

        </form>

    </main>

</div>

</body>
</html>

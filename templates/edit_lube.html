<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#07120C">
<link rel="apple-touch-icon" href="/static/images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/images/icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sai Fuel Mart">
    <title>Edit Lube - Sai Fuel Mart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/daily_closing.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>

<body>

<div class="main-content">

    <div class="topbar">
        <div>
            <h1>Edit Lube Product</h1>
            <p>Manual stock update</p>
        </div>
    </div>

    <form method="POST" action="/update-lube/{{ item['id'] }}" class="box">

        <div class="form-grid">

            <div class="input-group">
                <label>Product Name</label>
                <input type="text" name="product_name" value="{{ item['product_name'] }}" required>
            </div>

            <div class="input-group">
                <label>Selling Rate</label>
                <input type="number" step="0.01" name="selling_rate" value="{{ item['selling_rate'] }}" required>
            </div>

            <div class="input-group">
                <label>Opening Stock</label>
                <input type="number" step="0.01" name="opening_stock" value="{{ item['opening_stock'] }}" required>
            </div>

            <div class="input-group">
                <label>Purchase Qty</label>
                <input type="number" step="0.01" name="purchase_qty" value="{{ item['purchase_qty'] }}" required>
            </div>

            <div class="input-group">
                <label>Sale Qty</label>
                <input type="number" step="0.01" name="sale_qty" value="{{ item['sale_qty'] }}" required>
            </div>

            <div class="input-group">
                <label>Closing Stock</label>
                <input type="number" step="0.01" value="{{ item['closing_stock'] }}" readonly>
            </div>

        </div>

        <br>

        <button class="save-btn-top" type="submit">Update Product</button>
        <a href="/lube-stock" class="add-btn">Back</a>

    </form>

</div>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function () {
            // registration failure shouldn't break the page
        });
    });
}
</script>

</body>
</html>

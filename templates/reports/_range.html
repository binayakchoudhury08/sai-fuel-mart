<form class="formrow noprint section" method="get" style="padding:12px 16px">
<div><label>From</label><input type="date" name="from" value="{{ start.isoformat() }}"></div>
<div><label>To</label><input type="date" name="to" value="{{ end.isoformat() }}"></div>
{{ extra|default('')|safe }}
<div style="flex:0"><button class="btn secondary">Show</button></div>
<div style="flex:0"><button class="btn secondary" name="format" value="pdf">PDF</button></div>
<div style="flex:0"><button class="btn secondary" name="format" value="xlsx">Excel</button></div></form>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#07120C">
<link rel="apple-touch-icon" href="/static/images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/images/icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sai Fuel Mart">
<meta charset="UTF-8">
<title>Edit Transport Entry</title>

<style>

body{
    background:#f3f4f6;
    font-family:Segoe UI;
    padding:40px;
}

.card{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    margin-bottom:25px;
    color:#07120C;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.group{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
}

input,
select{
    height:45px;
    border:1px solid #dbe2ea;
    border-radius:10px;
    padding:0 12px;
}

.save-btn{
    width:100%;
    margin-top:20px;
    height:50px;
    border:none;
    border-radius:14px;
    background:#16a34a;
    color:white;
    font-weight:900;
    cursor:pointer;
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    text-decoration:none;
    background:#07120C;
    color:white;
    padding:10px 15px;
    border-radius:10px;
}


@media(max-width:600px){
.form-grid{
    grid-template-columns:1fr;
}
.card{
    max-width:100%;
    margin:0;
    border-radius:18px;
}
body{
    padding:16px;
}
}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>

<body>

<div class="card">

<a
href="/credit-transport"
class="back-btn">

← Back

</a>

<h1>Edit Transport Entry</h1>

<form
method="POST"
action="/update-transport-entry/{{ entry['id'] }}">

<div class="form-grid">

<div class="group">
<label>Date</label>
<input
type="date"
name="entry_date"
value="{{ entry['entry_date'] }}"
required>
</div>

<div class="group">
<label>Transporter</label>

<select
name="transporter_id"
required>

{% for t in transporters %}

<option
value="{{ t['id'] }}"
{% if t['id']==entry['transporter_id'] %}
selected
{% endif %}
>

{{ t["party_name"] }}

</option>

{% endfor %}

</select>

</div>

<div class="group">
<label>Challan No</label>
<input
type="text"
name="challan_no"
value="{{ entry['challan_no'] }}">
</div>

<div class="group">
<label>Vehicle No</label>
<input
type="text"
name="vehicle_no"
value="{{ entry['vehicle_no'] }}">
</div>

<div class="group">
<label>Slip No</label>
<input
type="text"
name="slip_no"
value="{{ entry['slip_no'] }}">
</div>

<div class="group">
<label>HSD Qty</label>
<input
type="number"
step="0.01"
name="hsd_qty"
id="hsd_qty"
value="{{ entry['hsd_qty'] or 0 }}">
</div>

<div class="group">
<label>Rate</label>
<input
type="number"
step="0.01"
name="rate"
id="rate"
value="{{ entry['rate'] or 0 }}">
</div>

<div class="group">
<label>Cash Taken</label>
<input
type="number"
step="0.01"
name="cash_taken"
id="cash_taken"
value="{{ entry['cash_taken'] or 0 }}">
</div>

<div class="group">
<label>HSD Amount</label>
<input
type="number"
step="0.01"
id="hsd_amount"
value="{{ entry['hsd_amount'] or 0 }}"
readonly>
</div>

<div class="group">
<label>Total Amount</label>
<input
type="number"
step="0.01"
id="total_amount"
value="{{ entry['total_amount'] or 0 }}"
readonly>
</div>

</div>

<button
type="submit"
class="save-btn">

Update Entry

</button>

</form>

</div>

<script>

function calculateAmounts(){

    let qty =
    parseFloat(
        document.getElementById("hsd_qty").value
    ) || 0;

    let rate =
    parseFloat(
        document.getElementById("rate").value
    ) || 0;

    let cash =
    parseFloat(
        document.getElementById("cash_taken").value
    ) || 0;

    let hsdAmount =
    qty * rate;

    let total =
    hsdAmount + cash;

    document.getElementById("hsd_amount").value =
    hsdAmount.toFixed(2);

    document.getElementById("total_amount").value =
    total.toFixed(2);
}

document
.getElementById("hsd_qty")
.addEventListener(
    "input",
    calculateAmounts
);

document
.getElementById("rate")
.addEventListener(
    "input",
    calculateAmounts
);

document
.getElementById("cash_taken")
.addEventListener(
    "input",
    calculateAmounts
);

</script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function () {
            // registration failure shouldn't break the page
        });
    });
}
</script>

</body>
</html>

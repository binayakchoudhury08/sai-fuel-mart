<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#07120C">
<link rel="apple-touch-icon" href="/static/images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/images/icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sai Fuel Mart">
<meta charset="UTF-8">
<title>Edit Salary</title>

<style>

body{
    font-family:Segoe UI;
    background:#f3f4f6;
    padding:40px;
}

.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:25px;
}

h1{
    margin-bottom:25px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:700;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#16a34a;
    color:white;
    font-weight:800;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="card">

<h1>Edit Salary Payment</h1>

<form
method="POST"
action="/update-salary/{{ salary['id'] }}">

<div class="form-group">
<label>Date</label>
<input
type="date"
name="payment_date"
value="{{ salary['payment_date'] }}"
required>
</div>

<div class="form-group">
<label>Month</label>
<input
type="month"
name="month_name"
value="{{ salary['month_name'] }}"
required>
</div>

<div class="form-group">
<label>Employee</label>
<input
type="text"
name="employee_name"
value="{{ salary['employee_name'] }}"
required>
</div>

<div class="form-group">
<label>Payment Mode</label>

<select name="payment_mode">

<option value="Cash"
{% if salary["payment_mode"]=="Cash" %}
selected
{% endif %}>
Cash
</option>

<option value="Bank"
{% if salary["payment_mode"]=="Bank" %}
selected
{% endif %}>
Bank
</option>

</select>

</div>

<div class="form-group">
<label>Bank Account</label>
<input
type="text"
name="bank_account"
value="{{ salary['bank_account'] }}">
</div>

<div class="form-group">
<label>Amount</label>
<input
type="number"
step="0.01"
name="amount"
value="{{ salary['amount'] }}"
required>
</div>

<div class="form-group">
<label>Remarks</label>
<input
type="text"
name="remarks"
value="{{ salary['remarks'] }}">
</div>

<button type="submit">
Update Salary
</button>

</form>

</div>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function () {
            // registration failure shouldn't break the page
        });
    });
}
</script>

</body>
</html>

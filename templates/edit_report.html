<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#07120C">
<link rel="apple-touch-icon" href="/static/images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/images/icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sai Fuel Mart">
    <title>Edit Report - Sai Fuel Mart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/daily_closing.css') }}">
</head>

<body>

<div class="main-content">

    <div class="topbar">
        <div>
            <h1>Edit Daily Closing Report</h1>
            <p>Update saved record</p>
        </div>
    </div>

    <form method="POST" action="/update-report/{{ row['id'] }}" class="box">

        <div class="form-grid">

            <div class="input-group">
                <label>Date</label>
                <input type="text" name="date" value="{{ row['date'] }}">
            </div>

            <div class="input-group">
                <label>MS Litres</label>
                <input type="number" step="0.01" name="ms_litres" value="{{ row['ms_litres'] }}">
            </div>

            <div class="input-group">
                <label>HSD Litres</label>
                <input type="number" step="0.01" name="hsd_litres" value="{{ row['hsd_litres'] }}">
            </div>

            <div class="input-group">
                <label>Total Fuel Sale</label>
                <input type="number" step="0.01" name="total_fuel_sale" value="{{ row['total_fuel_sale'] }}">
            </div>

            <div class="input-group">
                <label>Lube Sale</label>
                <input type="number" step="0.01" name="lube_sale" value="{{ row['lube_sale'] }}">
            </div>

            <div class="input-group">
                <label>Digital Collection</label>
                <input type="number" step="0.01" name="digital_collection" value="{{ row['digital_collection'] }}">
            </div>

            <div class="input-group">
                <label>Credit Given</label>
                <input type="number" step="0.01" name="credit_given" value="{{ row['credit_given'] }}">
            </div>

            <div class="input-group">
                <label>Transport Received</label>
                <input type="number" step="0.01" name="transport_received" value="{{ row['transport_received'] }}">
            </div>

            <div class="input-group">
                <label>Net Credit Due</label>
                <input type="number" step="0.01" name="net_credit_due" value="{{ row['net_credit_due'] }}">
            </div>

            <div class="input-group">
                <label>Total Expense</label>
                <input type="number" step="0.01" name="total_expense" value="{{ row['total_expense'] }}">
            </div>

            <div class="input-group">
                <label>Cash In Hand</label>
                <input type="number" step="0.01" name="cash_in_hand" value="{{ row['cash_in_hand'] }}">
            </div>

        </div>

        <br>

        <button class="save-btn-top" type="submit">Update Report</button>
        <a href="/reports" class="add-btn">Back</a>

    </form>

</div>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function () {
            // registration failure shouldn't break the page
        });
    });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#07120C">
<link rel="apple-touch-icon" href="/static/images/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/images/icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sai Fuel Mart">
    <title>Sai Fuel Mart Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Inter, Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
                linear-gradient(rgba(7,18,12,.68), rgba(7,18,12,.68)),
                url("/static/images/petrol-pump-bg.jpg");
            background-size:cover;
            background-position:center;
            overflow:hidden;
        }

        body::before{
            content:"";
            position:fixed;
            inset:0;
            backdrop-filter:blur(1px);
            z-index:0;
        }

        .login-box{
            position:relative;
            z-index:1;
            width:420px;
            background:rgba(255,255,255,.92);
            border-radius:28px;
            padding:34px;
            box-shadow:0 30px 80px rgba(0,0,0,.35);
        }

        .login-box h1{
            font-size:30px;
            margin-bottom:8px;
            color:#07120c;
        }

        .login-box p{
            color:#667085;
            margin-bottom:28px;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            color:#344054;
            font-weight:600;
            font-size:14px;
        }

        .input-group input{
            width:100%;
            padding:14px 16px;
            border-radius:16px;
            border:1px solid #d0d5dd;
            outline:none;
            font-size:15px;
        }

        .input-group input:focus{
            border-color:#16a34a;
            box-shadow:0 0 0 4px rgba(22,163,74,.10);
        }

        .remember{
            display:flex;
            align-items:center;
            gap:8px;
            color:#475467;
            font-size:14px;
            margin-bottom:22px;
        }

        button{
            width:100%;
            border:none;
            background:#07120c;
            color:white;
            padding:15px;
            border-radius:16px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:.25s;
        }

        button:hover{
            background:#0f2a18;
            transform:translateY(-2px);
        }

        .error{
            color:#b91c1c;
            margin-top:14px;
            font-size:14px;
        }

        @media(max-width:480px){
            .login-box{
                width:calc(100vw - 32px);
                padding:26px;
            }
        }
    </style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>

<body>

    <form method="POST" class="login-box">

        <h1>SAI FUEL MART</h1>
        <p>Login to fuel operations dashboard</p>

        <div class="input-group">
            <label>Username</label>
            <input name="username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <label class="remember">
            <input type="checkbox" name="remember">
            Remember me
        </label>

        <button type="submit">Login</button>

        <div class="error">{{ error }}</div>

    </form>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function () {
            // registration failure shouldn't break the page
        });
    });
}
</script>

</body>
</html>
